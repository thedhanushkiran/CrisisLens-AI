services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crisislens
      POSTGRES_USER: crisislens
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - crisislens-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crisislens -d crisislens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crisislens-postgres:
